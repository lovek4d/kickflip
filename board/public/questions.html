<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Waiting On You</title>
<link rel="stylesheet" href="colors.css">
<link rel="stylesheet" href="style.css">
<link rel="apple-touch-icon" href="{{touchIcon}}">
<style>
  .q { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin: 12px 0; }
  .q.urgent { border-color: var(--color-notice); }
  .q h3 { font-size: 15px; margin: 6px 0 4px; line-height: 1.3; }
  .ctx { color: var(--muted); font-size: 13px; margin-bottom: 8px; }
  .opt { display: grid; grid-template-columns: 22px 1fr; gap: 6px; padding: 8px; border: 1px solid var(--line);
    border-radius: 8px; margin: 6px 0; cursor: pointer; }
  .opt:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
  .opt input { margin: 3px 0 0; width: 16px; height: 16px; accent-color: var(--accent); }
  .opt .lbl { font-weight: 600; }
  .opt .rec { color: var(--accent); font-weight: 500; font-size: 12px; margin-left: 4px; }
  .opt .det { color: var(--muted); font-size: 13px; }
  .note { margin-top: 4px; }
  .ans { background: var(--love); border-radius: 9px; padding: 7px 10px; margin-top: 8px; font-size: 13px; }
  .rep { background: var(--claude); border-radius: 9px; padding: 7px 10px; margin-top: 6px; font-size: 13px; }
  .q details { margin-top: 8px; }
  .q details > summary { cursor: pointer; color: var(--muted); font-size: 13px; }
  .topics { display: flex; gap: 6px; overflow-x: auto; padding: 2px 0 8px; margin-bottom: 4px; }
  .topics button { flex: none; border: 1px solid var(--line); border-radius: 999px; padding: 4px 11px; font-size: 13px;
    background: var(--panel); color: var(--text); white-space: nowrap; }
  .topics button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
  .topics .n { color: var(--muted); margin-left: 4px; }
  .topichead { margin: 2px 0 6px; }
  details.done > summary { cursor: pointer; color: var(--muted); font-size: 13px; margin: 16px 0 4px; }
  details.done .trow { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  details.done button.ghost { font-size: 14px; text-align: left; padding: 6px 2px; }
  details.done .trow button { min-width: 0; }
  details.done .trow span { flex: none; }
  .bar { position: sticky; bottom: 0; padding: 10px 0 max(10px, env(safe-area-inset-bottom)); background: var(--bg);
    display: flex; justify-content: space-between; align-items: center; gap: 8px; border-top: 1px solid var(--line); }
  .bar .send-hint { margin-left: auto; }
  .solo { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin: 4px 0; }

  /* A question's takes inline: one full width with the next peeking on a phone, side by side from 900px. */
  .takes { margin: 6px 0; }
  .take-track { display: flex; gap: 10px; overflow-x: auto; scroll-snap-type: x mandatory; margin: 0 -12px; padding: 2px 12px 4px;
    scrollbar-width: none; overscroll-behavior-x: contain; }
  .take-track::-webkit-scrollbar { display: none; }
  .take { flex: 0 0 86%; scroll-snap-align: center; min-width: 0; border: 1px solid var(--line); border-radius: 12px;
    background: var(--bg); padding: 10px; }
  .take:has(input:checked) { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .take .opt, .take .opt:has(input:checked) { border: 0; padding: 0; margin: 0; background: none; }
  .take-shot { display: block; margin-top: 8px; height: 360px; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .take-shot iframe { width: 100%; height: 100%; border: 0; pointer-events: none; background: var(--bg); }
  .take-open { display: inline-block; margin-top: 8px; font-size: 13px; color: var(--accent); text-decoration: none; }
  .take-dots { display: flex; justify-content: center; align-items: center; gap: 6px; margin-top: 6px; }
  .take-dots button { width: 22px; height: 22px; border: 0; padding: 0; background: none; display: grid; place-items: center; }
  .take-dots button::after { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--line); }
  .take-dots button.on::after { background: var(--muted); }
  .take-dots button.picked::after { background: var(--accent); width: 9px; height: 9px; box-shadow: 0 0 0 2px var(--accent-soft); }
  .take-dots .lab { font-size: 12px; color: var(--muted); margin-left: 4px; }
  @media (min-width: 900px) {
    .take-track { display: grid; grid-template-columns: repeat(var(--n, 3), minmax(0, 1fr)); overflow: visible; margin: 0; padding: 0; }
    .take-dots { display: none; }
  }

  /* A take with nothing to see: boxes and arrows, then what it means in practice. */
  .flow { margin: 10px 0 4px; }
  .flow-row { display: grid; gap: 6px; }
  .flow-row.dense { gap: 4px; }
  .flow-box { position: relative; display: grid; place-items: center; border: 1.5px solid var(--line); border-radius: 8px;
    background: var(--panel); padding: 6px 7px; font-size: 12px; line-height: 1.25; text-align: center; overflow-wrap: anywhere; hyphens: auto; }
  .flow-row.dense .flow-box { font-size: 11px; padding: 5px 2px; }
  .flow-box.in::before { content: ''; position: absolute; top: -6px; left: 50%; transform: translateX(-50%);
    border: 5px solid transparent; border-top-color: var(--muted); border-bottom: 0; }
  .flow-box.tone-info { border-color: var(--color-info); }
  .flow-box.tone-notice { border-color: var(--color-notice); }
  .flow-box.tone-danger { border-color: var(--color-danger); }
  .flow-box.tone-success { border-color: var(--color-success); }
  .flow-box.tone-quiet { border-style: dashed; color: var(--muted); }
  .flow-conn { display: block; width: 100%; height: 18px; }
  .flow-conn line { stroke: var(--muted); stroke-width: 1.3; vector-effect: non-scaling-stroke; }
  .practice { font-size: 13px; margin-top: 8px; }
  .practice b { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  .practice ul { margin: 4px 0 0; padding-left: 18px; }
  .practice li { margin: 3px 0; }
</style>
</head>
<body>
<!--header {"lead":"back","title":"Waiting on you","controls":false,"trail":"<span class=\"muted small\" id=\"progress\"></span>"}-->
<main>
  <section id="page"></section>
</main>
<script src="claude.js"></script>
<script src="dialogs.js"></script>
<script src="ui.js"></script>
<script src="ui-links.js"></script>
<script src="ui-questions.js"></script>
<script src="attach.js"></script>
<script>
(function () {
  // A topic's questions show on one page with one Send at the bottom, which sends an `owner-answer`
  // event per question answered there; the rest stay open for a later visit. An open question with
  // `urgent: true` in owner.json shows alone first.
  const { esc, choiceLabel, questionCard, linkContext, badge, topicName, topicRow } = BoardUI;
  // prototype-switcher.js reads a draft's note and clears the draft once it sends that question's answer.
  const draftKey = (id) => 'qdraft:' + id;
  const getDraft = (id) => { try { return JSON.parse(localStorage.getItem(draftKey(id)) || '{}'); } catch { return {}; } };
  const setDraft = (id, v) => { try { localStorage.setItem(draftKey(id), JSON.stringify(v)); } catch {} };

  let all = [];
  let items = [];
  let topics = [];
  let topicId = null;
  let soloId = null;
  let shown = '';

  const byId = (id) => all.find((q) => q.id === id);
  const topicOf = (qid) => topics.find((t) => t.questions.includes(qid)) || null;
  const openTopics = () => topics.filter((t) => t.state !== 'resolved');
  const links = (q) => linkContext(items, q.topic?.startsWith('item:') ? q.topic.slice(5) : null, { base: './' });
  const urgentOpen = () => all.find((q) => q.urgent && q.state === 'open');

  // docs/adr/0038-waiting-on-you-leads-with-what-needs-the-owner.md
  function topicBar() {
    const list = topicRow(topics, topicId).pills;
    if (list.length < 2) return '';
    return `<div class="topics" role="group" aria-label="Topics">${list.map((t) =>
      `<button data-topic="${esc(t.id)}" aria-pressed="${t.id === topicId}" title="${esc(t.title)}">${esc(topicName(t))}<span class="n">${t.state === 'resolved' ? 'resolved' : t.open}</span></button>`).join('')}</div>`;
  }
  const topicHead = (t) => t ? `<div class="topichead muted small">${esc(t.title)}${t.summary ? ` · ${esc(t.summary)}` : ''}</div>` : '';

  // Only questions changed on this page since their last answer, or with files attached, are sent.
  const filesOf = (q) => BoardAttach.files('q:' + q.id);
  const uploading = (qs) => qs.some((q) => BoardAttach.busy('q:' + q.id));
  function pending(qs) {
    return qs.filter((q) => {
      const d = getDraft(q.id);
      if (filesOf(q).length) return true;
      if (!('choice' in d) && !d.note) return false;
      const last = q.answers[q.answers.length - 1];
      return !last || (d.choice ?? last.choice) !== last.choice || (d.note || '') !== (last.note || '');
    });
  }

  function visible() {
    if (soloId) return [byId(soloId)].filter(Boolean);
    const t = topics.find((x) => x.id === topicId);
    return t ? t.questions.map(byId).filter(Boolean) : [];
  }

  function render() {
    const el = document.getElementById('page');
    const qs = visible();
    if (!qs.length) {
      el.innerHTML = '<p class="muted">Nothing is waiting on you.</p>' + waitingTopics() + resolvedTopics();
      document.getElementById('progress').textContent = '';
      return;
    }
    const t = topics.find((x) => x.id === topicId);
    const live = qs.filter((q) => q.state !== 'resolved');
    const done = qs.filter((q) => q.state === 'resolved');
    const head = soloId
      ? `<div class="solo">${badge('notice', 'needs you first')}<button class="ghost" id="showAll">All questions</button></div>`
      : `${topicBar()}${topicHead(t)}`;
    el.innerHTML = `${head}<form id="qform">
      ${live.map((q, i) => questionCard(q, { n: soloId ? 0 : i + 1, draft: getDraft(q.id), links: links(q) })).join('')}
      ${done.length ? `<details class="done"><summary>Resolved · ${done.length}</summary>${done.map((q) => questionCard(q, { draft: getDraft(q.id), links: links(q) })).join('')}</details>` : ''}
      <div class="bar"><span class="muted small" id="qstatus"></span><span class="send-hint" aria-hidden="true">${/Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent) ? '⌘↵' : 'Ctrl+↵'}</span><button class="primary" type="submit" id="send">Send</button></div>
    </form>${soloId ? '' : waitingTopics() + resolvedTopics()}`;
    BoardAttach.paintAll();
    el.querySelectorAll('.takes').forEach(wireTakes);
    updateBar();
  }

  // The dot under the take in view is on; a dot's tap brings its take into view. Opens on the pick, if any.
  function wireTakes(box) {
    const track = box.querySelector('.take-track');
    const dots = [...box.querySelectorAll('[data-dot]')];
    const lab = box.querySelector('.lab');
    const centre = (c) => c.offsetLeft - (track.clientWidth - c.offsetWidth) / 2;
    const at = () => {
      const cards = [...track.children];
      return cards.reduce((best, c, i) => (Math.abs(centre(c) - track.scrollLeft) < Math.abs(centre(cards[best]) - track.scrollLeft) ? i : best), 0);
    };
    const paint = () => { const i = at(); dots.forEach((d, j) => d.classList.toggle('on', j === i)); lab.textContent = `${i + 1} of ${dots.length}`; };
    track.addEventListener('scroll', () => requestAnimationFrame(paint), { passive: true });
    dots.forEach((d, i) => d.addEventListener('click', () => track.scrollTo({ left: centre(track.children[i]), behavior: 'smooth' })));
    const picked = dots.findIndex((d) => d.classList.contains('picked'));
    if (picked > 0) { track.scrollLeft = centre(track.children[picked]); paint(); }
  }

  function waitingTopics() {
    const list = topicRow(topics, topicId).waiting;
    return list.length ? `<details class="done"><summary>Waiting on Claude · ${list.length}</summary>${list.map((t) =>
      `<div class="trow"><button class="ghost" data-topic="${esc(t.id)}">${esc(t.title)}</button><span class="muted small">${t.answered ? 'answered' : 'Claude replied'}</span></div>`).join('')}</details>` : '';
  }

  function resolvedTopics() {
    const done = topics.filter((t) => t.state === 'resolved' && t.id !== topicId);
    return done.length ? `<details class="done"><summary>Resolved topics · ${done.length}</summary>${done.map((t) =>
      `<div><button class="ghost" data-topic="${esc(t.id)}">${esc(t.title)}</button></div>`).join('')}</details>` : '';
  }

  function updateBar() {
    const qs = visible();
    const n = pending(qs).length;
    const b = document.getElementById('send');
    if (b) { b.disabled = !n || uploading(qs); b.textContent = uploading(qs) ? 'Uploading…' : n ? `Send ${n} answer${n === 1 ? '' : 's'}` : 'Send'; }
    const live = qs.filter((q) => q.state !== 'resolved');
    const answered = live.filter((q) => q.state !== 'open').length;
    document.getElementById('progress').textContent = live.length > 1 ? `${answered}/${live.length} answered` : '';
  }

  function pick(hash) {
    const u = urgentOpen();
    if (u && (!hash || hash === u.id)) { soloId = u.id; topicId = topicOf(u.id)?.id ?? null; return; }
    soloId = null;
    const t = (hash && topicOf(hash)) || openTopics().find((x) => x.open) || openTopics()[0];
    topicId = t ? t.id : null;
  }

  async function load(first) {
    try {
      const d = await (await fetch(ClaudeSite.url('api/board'), { cache: 'no-store' })).json();
      all = d.owner || [];
      items = d.items || [];
      topics = d.ownerTopics || [];
      ClaudeSite.syncBadge();
      const hash = location.hash.slice(1);
      if (first) pick(hash);
      else if (soloId && byId(soloId)?.state !== 'open') pick('');
      else if (!topics.some((t) => t.id === topicId)) pick('');
      const sig = JSON.stringify([soloId, topicId, topics.map((t) => [t.id, t.state, t.open, t.answered]), visible().map((q) => [q.id, q.state, q.answers.length, q.answers.map((a) => Boolean(a.reply))])]);
      const active = document.activeElement;
      if (sig !== shown && !(active && active.tagName === 'TEXTAREA')) {
        shown = sig;
        const y = window.scrollY;
        render();
        if (first && hash && document.getElementById(hash)) document.getElementById(hash).scrollIntoView({ block: 'start' });
        else window.scrollTo(0, y);
      }
    } catch { /* keep what is shown */ }
  }

  document.addEventListener('click', (ev) => {
    if (ev.target.id === 'showAll') { soloId = null; shown = ''; render(); return; }
    const b = ev.target.closest && ev.target.closest('[data-topic]');
    if (b) { soloId = null; topicId = b.dataset.topic; shown = ''; render(); window.scrollTo(0, 0); }
  });
  document.addEventListener('change', (ev) => {
    const sec = ev.target.closest('section.q'); if (!sec || ev.target.type !== 'radio') return;
    const d = getDraft(sec.dataset.q); d.choice = ev.target.value; setDraft(sec.dataset.q, d); updateBar();
    sec.querySelectorAll('.take').forEach((t, i) => sec.querySelector(`[data-dot="${i}"]`)?.classList.toggle('picked', t.dataset.opt === ev.target.value));
  });
  document.addEventListener('input', (ev) => {
    const sec = ev.target.closest('section.q'); if (!sec || ev.target.tagName !== 'TEXTAREA') return;
    const d = getDraft(sec.dataset.q); d.note = ev.target.value; setDraft(sec.dataset.q, d); updateBar();
  });
  document.addEventListener('keydown', (ev) => {
    if (ev.key !== 'Enter' || !(ev.metaKey || ev.ctrlKey) || ev.isComposing || ev.target.tagName !== 'TEXTAREA') return;
    const form = ev.target.closest('#qform');
    if (!form) return;
    ev.preventDefault();
    form.requestSubmit();
  });
  document.addEventListener('submit', async (ev) => {
    if (ev.target.id !== 'qform') return;
    ev.preventDefault();
    const list = pending(visible());
    const st = document.getElementById('qstatus');
    if (uploading(visible())) return;
    if (!list.length) { st.textContent = 'Pick an option or write a note first.'; return; }
    st.textContent = 'Sending…';
    let sent = 0;
    try {
      for (const q of list) {
        const d = getDraft(q.id);
        const last = q.answers[q.answers.length - 1];
        const choice = d.choice ?? (last ? last.choice : null);
        const files = filesOf(q);
        await ClaudeSite.send('owner-answer', { id: q.id, question: q.question, choice, label: choiceLabel(q, choice), note: (d.note || '').trim(), ...(files.length ? { files } : {}) });
        setDraft(q.id, {});
        BoardAttach.clear('q:' + q.id);
        sent++;
      }
      shown = '';
      await load(false);
      const left = visible().filter((q) => q.state === 'open').length;
      document.getElementById('qstatus').textContent = `Sent ${sent}.${left ? ` ${left} still open, answer them any time.` : ' Claude replies under each one.'}`;
    } catch { st.textContent = sent ? `Sent ${sent} of ${list.length}. Is the Mac awake?` : 'Could not send. Is the Mac awake?'; }
  });

  BoardAttach.onChange(updateBar);
  load(true);
  setInterval(() => { if (!document.hidden) load(false); }, 15000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) load(false); });
  // Back from a full-size take restores this page as it was, missing an answer sent there (prototype-switcher.js).
  addEventListener('pageshow', (ev) => { if (ev.persisted) { shown = ''; load(false); } });
})();
</script>
</body>
</html>
