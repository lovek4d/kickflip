<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{prototypeTitle}}</title>
<script>try { if (localStorage.getItem('hub:oled') === '1') document.documentElement.dataset.oled = ''; } catch {}</script>
<link rel="stylesheet" href="colors.css">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="hub.css">
<link rel="stylesheet" href="sidebar.css">
<style>
  /* The one page every recorded prototype is (board/server.mjs fills the {{…}} slots; prototype-kit.js documents what a
     take gets). main keeps room below the stage for the viewer's footer, at its measured height (prototype-switcher.js),
     which already holds the bottom inset. */
  main.proto-main { max-width: none; padding-left: 0; padding-right: 0; padding-bottom: calc(var(--ps-footer-h, 150px) + var(--app-bottom, 0px)); }
  /* kit.hub() is a whole page with its own gutter and header, so it goes edge to edge. */
  main.proto-main:has(> #stage > .kit-hub) { padding-top: 0; }
  /* contain and the transform make the stage the containing block of everything in it, position: fixed included, and
     clip its paint, so a take can't cover the header, the pill or the app shell around the page. */
  #stage { position: relative; max-width: 1180px; min-width: 0; margin: 0 auto; contain: layout paint; transform: translateZ(0); isolation: isolate; overflow-x: clip; padding: 0 16px; }
  #stage:has(> .kit-hub) { padding: 0; }
  #stage .top { position: static; }
  #stage .hub-view main { padding-bottom: 16px; }
  /* A served round's page, framed from the board's base prototype worktree, edge to edge from under the ✕ row to the
     viewer's footer; in the board's right pane (.ps-pane) there is no ✕ row, so it starts at the top. */
  #stage:has(> .kit-served) { max-width: none; padding: 0; }
  .kit-served { display: block; width: 100%; min-height: 320px; height: calc(100dvh - 60px - var(--ps-footer-h, 150px) - var(--app-bottom, 0px) - env(safe-area-inset-top)); border: 0; background: var(--panel); }
  .ps-pane .kit-served { height: calc(100dvh - var(--ps-footer-h, 150px)); }
  /* A served round's landing while its site starts (prototype-kit.js servedStatus), centred in the frame's place: the
     start steps' bars with a caption under each, grey but for the running one's orange and a failed one's red. */
  .kit-landing { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; box-sizing: border-box; padding: 16px;
    min-height: calc(100dvh - 60px - var(--ps-footer-h, 150px) - var(--app-bottom, 0px) - env(safe-area-inset-top)); text-align: center; color: var(--muted); font-size: 13px; }
  .ps-pane .kit-landing { min-height: calc(100dvh - var(--ps-footer-h, 150px)); }
  .kit-landing > p { margin: 0; max-width: 100%; }
  .kit-landing-steps { width: min(100%, 320px); }
  .kit-landing-steps .phase-bars { display: flex; gap: 4px; }
  .kit-landing-steps .phase-bars i { flex: 1 1 0; width: auto; height: 5px; }
  .kit-landing-captions { display: flex; gap: 4px; margin-top: 5px; }
  .kit-step { flex: 1 1 0; min-width: 0; font-size: 11px; font-variant-numeric: tabular-nums; }
  .kit-step.now { color: var(--color-notice); }
  .kit-step.failed, .kit-landing-why, .kit-landing-error { color: var(--color-danger); }
  .kit-landing-last { width: min(100%, 320px); font: 11px ui-monospace, monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .kit-landing-error { font: 12px ui-monospace, monospace; overflow-wrap: anywhere; }
  .kit-landing pre { width: min(100%, 640px); box-sizing: border-box; margin: 0; max-height: 40vh; overflow: auto; padding: 8px; border: 1px solid var(--line); border-radius: 8px;
    text-align: left; white-space: pre; font: 11px/1.35 ui-monospace, monospace; color: var(--text); }
  .kit-missing { margin: 0; padding: 16px; border: 1px dashed var(--line); border-radius: 12px; color: var(--muted); overflow-wrap: anywhere; }
  #protoToast { position: fixed; z-index: 40; left: 50%; top: calc(64px + env(safe-area-inset-top)); transform: translateX(-50%); max-width: calc(100vw - 32px); }
  #protoToast[hidden] { display: none; }
  @media (max-width: 899px) { #protoToast { top: max(12px, env(safe-area-inset-top)); } }

  /* A take's own boxes are capped to the stage at phone width, so a fixed-width panel never cuts off. prototype-kit.js
     (phoneFit) marks what the take lays side by side with data-stack, which stacks in one column whether the take used
     grid, flex (wrapping or not) or inline-block, and a frame 600px or wider with data-wide: it keeps its own layout
     and scrolls sideways inside its data-scroll box. */
  @media (max-width: 599px) {
    #stage :where(div, section, article, aside, nav, header, footer, main, form, ul, ol, table, figure):not([data-wide]) { max-width: 100%; min-width: 0; }
    #stage [data-scroll] { overflow-x: auto; max-width: 100%; }
    #stage [data-wide] { max-width: none; flex-shrink: 0; }
    #stage [data-stack] { display: flex !important; flex-direction: column !important; flex-wrap: nowrap !important; grid-template-columns: none !important; align-items: stretch !important; }
    #stage [data-stack] > * { width: auto !important; flex: 0 0 auto !important; grid-column: auto !important; float: none !important; }
  }
  /* iOS Safari zooms the page when it focuses a field under 16px. */
  #stage :where(input, select, textarea) { font-size: 16px; }
  #stage .kit-sidebar.sidebar { position: relative; inset: auto; z-index: auto; transform: none; visibility: visible; transition: none;
    width: min(320px, 100%); height: 640px; margin: 0 auto; padding: 0 8px; border: 1px solid var(--line); border-radius: 14px; }
  #stage .kit-sidebar.sidebar:not(.kit-head) > header.top { display: none; }
  @media (min-width: 900px) { #stage .kit-sidebar.sidebar { width: 272px; } }
  /* Everything a take draws shows at every width: the board's width-gated hides are undone here (style.css hides
     .board-pane below 900px, .key-hint below 600px). render-check.mjs refuses a take whose box is
     still hidden at one of its two widths, so a gate missed here fails the round instead of drawing blank. */
  #stage .board-pane { display: block; position: static; height: auto; overflow: visible; border-left: 0; padding: 0; }
  #stage .key-hint { display: inline; }
  #stage .kit-sheet-strip { padding: 32px 0 0; border-radius: 12px; background: rgba(0,0,0,.35); overflow: hidden; }
  #stage .kit-sheet { max-width: 560px; margin: 0 auto; border: 1px solid var(--line); border-bottom: 0; border-radius: 16px 16px 0 0; background: var(--panel); color: var(--text); box-shadow: 0 -8px 30px rgba(0,0,0,.18); }
  #stage .kit-sheet .sheet-head { padding: 10px 16px 0; }
  #stage .kit-sheet-body { padding: 6px 16px 16px; }
</style>
</head>
