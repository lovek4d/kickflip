<head>

<style>
  /* The stage a take-file round's takes draw in, framed by the viewer (prototype.html) and served with a sandbox
     header, so a take runs in an opaque origin that reads nothing of the board's
     (docs/adr/2026-11-18-0523-previews-run-in-a-sandboxed-opaque-origin.md; board/server.mjs fills the {{…}} slots,
     prototype-kit.js documents what a take gets). */
  main.proto-main { max-width: none; padding: 16px 0; }
  /* kit.hub() is a whole page with its own gutter and header, so it goes edge to edge. */
  main.proto-main:has(> #stage > .kit-hub) { padding-top: 0; }
  /* contain and the transform make the stage the containing block of everything in it, position: fixed included, and
     clip its paint. */
  #stage { position: relative; max-width: 1180px; min-width: 0; margin: 0 auto; contain: layout paint; transform: translateZ(0); isolation: isolate; overflow-x: clip; padding: 0 16px; }
  #stage:has(> .kit-hub) { padding: 0; }
  #stage .top { position: static; }
  #stage .hub-view main { padding-bottom: 16px; }
  .kit-missing { margin: 0; padding: 16px; border: 1px dashed var(--line); border-radius: 12px; color: var(--muted); overflow-wrap: anywhere; }
  #protoToast { position: fixed; z-index: 40; left: 50%; top: max(12px, env(safe-area-inset-top)); transform: translateX(-50%); max-width: calc(100vw - 32px); }
  #protoToast[hidden] { display: none; }

  /* A take's own boxes are capped to the stage at phone width, so a fixed-width panel never cuts off. prototype-kit.js
     (phoneFit) marks what the take lays side by side with data-stack, which stacks in one column whether the take used
     grid, flex (wrapping or not) or inline-block, and a frame 600px or wider with data-wide: it keeps its own layout
     and scrolls sideways inside its data-scroll box. */
  @media (max-width: 599px) {
    #stage :where(div, section, article, aside, nav, header, footer, main, form, ul, ol, table, figure):not([data-wide]) { max-width: 100%; min-width: 0; }
    #stage [data-scroll] { overflow-x: auto; max-width: 100%; }
    #stage [data-wide] { max-width: none; flex-shrink: 0; }
    #stage [data-stack] { display: flex !important; flex-direction: column !important; flex-wrap: nowrap !important; grid-template-columns: none !important; align-items: stretch !important; }
    #stage [data-stack] > * { width: auto !important; flex: 0 0 auto !important; grid-column: auto !important; float: none !important; }
  }
  /* iOS Safari zooms the page when it focuses a field under 16px. */
  #stage :where(input, select, textarea) { font-size: 16px; }
  #stage .kit-sidebar.sidebar { position: relative; inset: auto; z-index: auto; transform: none; visibility: visible; transition: none;
    width: min(320px, 100%); height: 640px; margin: 0 auto; padding: 0 8px; border: 1px solid var(--line); border-radius: 14px; }
  #stage .kit-sidebar.sidebar:not(.kit-head) > header.top { display: none; }
  @media (min-width: 900px) { #stage .kit-sidebar.sidebar { width: 272px; } }
  /* Everything a take draws shows at every width: the board's width-gated hides are undone here (style.css hides
     .board-pane below 900px, .key-hint below 600px). render-check.mjs refuses a take whose box is
     still hidden at one of its two widths, so a gate missed here fails the round instead of drawing blank. */
  #stage .board-pane { display: block; position: static; height: auto; overflow: visible; border-left: 0; padding: 0; }
  #stage .key-hint { display: inline; }
  #stage .kit-sheet-strip { padding: 32px 0 0; border-radius: 12px; background: rgba(0,0,0,.35); overflow: hidden; }
  #stage .kit-sheet { max-width: 560px; margin: 0 auto; border: 1px solid var(--line); border-bottom: 0; border-radius: 16px 16px 0 0; background: var(--panel); color: var(--text); box-shadow: 0 -8px 30px rgba(0,0,0,.18); }
  #stage .kit-sheet .sheet-head { padding: 10px 16px 0; }
  #stage .kit-sheet-body { padding: 6px 16px 16px; }
</style>
