<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Notes</title>
<link rel="stylesheet" href="colors.css">
<link rel="stylesheet" href="style.css">
<link rel="apple-touch-icon" href="{{touchIcon}}">
</head>
<body class="view-plan">
<!--header {"lead":"back","title":"Notes","titleId":"ref","backId":"back","controls":false}-->
<main>
  <article class="plan" id="plan"><p class="muted">Loading the notes…</p></article>
</main>
<script src="claude.js"></script>
<script src="dialogs.js"></script>
<script src="ui.js"></script>
<script src="ui-links.js"></script>
<script src="ui-markdown.js"></script>
<script>
(async function () {
  // notes.html?item=<wave>/<id> shows that item's notes (docs/adr/0053-notes-replace-the-full-plan-and-cards-start-on-their-own.md).
  const { esc, markdown, linkContext, fetchJSON, restartNotice } = BoardUI;
  const key = new URLSearchParams(location.search).get('item') || '';
  const el = document.getElementById('plan');
  document.getElementById('back').href = `./#item=${encodeURIComponent(key)}`;
  const onWait = () => { el.innerHTML = restartNotice(); };
  try {
    const board = fetchJSON(ClaudeSite.url('api/board')).then((r) => r.body).catch(() => ({}));
    const r = await fetchJSON(ClaudeSite.url(`api/notes?item=${encodeURIComponent(key)}`), { onWait });
    if (!r.ok) throw new Error(r.body.error || `notes ${r.status}`);
    document.getElementById('ref').textContent = `${r.body.ref} notes`;
    document.title = `${r.body.ref} notes`;
    el.innerHTML = markdown(r.body.markdown, linkContext((await board).items || [], key, { base: './' }));
  } catch (e) {
    el.innerHTML = `<p class="muted">Could not load these notes: ${esc(e.message)}</p>`;
  }
})();
</script>
</body>
</html>
