<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Notes</title>
<link rel="stylesheet" href="colors.css">
<link rel="stylesheet" href="style.css">
<link rel="apple-touch-icon" href="{{touchIcon}}">
<style>
  .plan { overflow-wrap: anywhere; line-height: 1.5; }
  .plan h1 { font-size: 20px; line-height: 1.3; margin: 8px 0 10px; }
  .plan h2 { font-size: 17px; margin: 22px 0 8px; }
  .plan h3, .plan h4, .plan h5, .plan h6 { font-size: 15px; margin: 18px 0 6px; }
  .plan p, .plan ul, .plan ol, .plan blockquote { margin: 8px 0; }
  .plan ul, .plan ol { padding-left: 22px; }
  .plan li { margin: 3px 0; }
  .plan li.nested { margin-left: 20px; }
  .plan code { font-size: 12.5px; background: var(--accent-soft); border-radius: 4px; padding: 0 3px; }
  .plan pre { overflow-x: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
  .plan pre code { background: none; padding: 0; overflow-wrap: normal; }
  .plan blockquote { border-left: 3px solid var(--line); padding-left: 10px; color: var(--muted); }
  .plan hr { border: 0; border-top: 1px solid var(--line); margin: 16px 0; }
  .plan a { color: var(--accent); }
  .md-table { overflow-x: auto; margin: 10px 0; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
  .md-table table { border-collapse: collapse; font-size: 13px; line-height: 1.4; }
  .md-table th, .md-table td { text-align: left; vertical-align: top; padding: 6px 8px; border-bottom: 1px solid var(--line); min-width: 5em; overflow-wrap: normal; }
  .md-table th { background: var(--bg); font-weight: 600; }
  .md-table tr:last-child td { border-bottom: 0; }
  .md-table .wide { min-width: 14em; }
  .md-table .wider { min-width: 24em; }
</style>
</head>
<body>
<!--header {"lead":"back","title":"Notes","titleId":"ref","backId":"back","controls":false}-->
<main>
  <article class="plan" id="plan"><p class="muted">Loading the notes…</p></article>
</main>
<script src="claude.js"></script>
<script src="dialogs.js"></script>
<script src="ui.js"></script>
<script src="ui-links.js"></script>
<script src="ui-markdown.js"></script>
<script>
(async function () {
  // notes.html?item=<wave>/<id> shows that item's notes (docs/adr/0053-notes-replace-the-full-plan-and-build-gives-the-go.md).
  const { esc, markdown, linkContext, fetchJSON, restartNotice } = BoardUI;
  const key = new URLSearchParams(location.search).get('item') || '';
  const el = document.getElementById('plan');
  document.getElementById('back').href = `./#item=${encodeURIComponent(key)}`;
  const onWait = () => { el.innerHTML = restartNotice(); };
  try {
    const board = fetchJSON(ClaudeSite.url('api/board')).then((r) => r.body).catch(() => ({}));
    const r = await fetchJSON(ClaudeSite.url(`api/notes?item=${encodeURIComponent(key)}`), { onWait });
    if (!r.ok) throw new Error(r.body.error || `notes ${r.status}`);
    document.getElementById('ref').textContent = `${r.body.ref} notes`;
    document.title = `${r.body.ref} notes`;
    el.innerHTML = markdown(r.body.markdown, linkContext((await board).items || [], key, { base: './' }));
  } catch (e) {
    el.innerHTML = `<p class="muted">Could not load these notes: ${esc(e.message)}</p>`;
  }
})();
</script>
</body>
</html>
