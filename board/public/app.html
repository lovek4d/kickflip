<title>Claude</title>
<script>
// The board this URL opens, or `/`'s last board, starts loading here, beside the scripts below; app.js loadBoard takes
// the loads over when it mounts that board. With a copy of the board saved under this build (app-snapshot.js
// copyVersion), it asks only for the changes since the copy's number, which carry the threads that changed
// (docs/adr/2026-11-14-1340-threads-ride-the-boards-sync.md); with none, the open cards' threads load beside the whole
// board. A board's other views load their own, and a site this device's last sidebar copy lists as no board loads
// nothing here. Above the stylesheets, since a script after one waits for it to load.
window.BoardBoot = (function () {
  if (!/^\/(?:[^/]+\/)?$/.test(location.pathname)) return null;
  let route = null;
  try { route = decodeURIComponent(location.pathname.split('/')[1] || '') || localStorage.getItem('hub:lastBoard'); } catch {}
  if (!route || route === '_hub') return null;
  try { if (JSON.parse(localStorage.getItem('hub:sidebar') || 'null')?.sites?.some((s) => s.route === route && !s.board)) return null; } catch {}
  const base = '/' + encodeURIComponent(route) + '/';
  // A failed answer rides on the error, for the board view's BoardUI.downOf.
  const unanswered = (r) => Object.assign(new Error(String(r.status)), { answer: r });
  const get = (u) => { const p = fetch(base + u, { cache: 'no-store' }).then((r) => (r.ok ? r.json().catch(() => { throw unanswered(r); }) : Promise.reject(unanswered(r)))); p.catch(() => {}); return p; };
  let open = [];
  try { open = JSON.parse(localStorage.getItem(`site:${route}:openItems`) || '[]'); } catch {}
  const focus = /[#&](?:selectedCard|item)=([^&]+)/.exec(location.hash);
  if (focus) open.push(decodeURIComponent(focus[1]));
  let since = null;
  try { const c = JSON.parse(localStorage.getItem(`site:${route}:copyVersion`) || 'null'); if (c?.build === document.documentElement.dataset.build && Number.isInteger(c.version)) since = c.version; } catch {}
  return { route, board: get('api/board' + (since === null ? '' : '?since=' + since)), threads: new Map(since === null ? [...new Set(open)].map((k) => [k, get('api/thread?key=' + encodeURIComponent(k))]) : []) };
})();
</script>

<script>try { if (localStorage.getItem('hub:oled') === '1') document.documentElement.dataset.oled = ''; } catch {}</script>
