<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>{{title}}</title>
<script>
// The board and its open cards' threads start loading here, beside the scripts below; app.js loadBoard takes them over.
// Above the stylesheet, since a script after one waits for it to load.
window.BoardBoot = (function () {
  const get = (u) => { const p = fetch(u, { cache: 'no-store' }).then((r) => (r.ok ? r.json() : Promise.reject(new Error(String(r.status))))); p.catch(() => {}); return p; };
  let open = [];
  try { open = JSON.parse(localStorage.getItem('openItems') || '[]'); } catch {}
  const focus = /^#item=(.+)$/.exec(location.hash);
  if (focus) open.push(decodeURIComponent(focus[1]));
  return { board: get('api/board'), threads: new Map([...new Set(open)].map((k) => [k, get('api/thread?key=' + encodeURIComponent(k))])) };
})();
</script>
<link rel="stylesheet" href="colors.css">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="sidebar.css">
<link rel="apple-touch-icon" href="{{touchIcon}}">
<link rel="manifest" href="/manifest.webmanifest">
</head>
<body class="has-sidebar">
<aside id="sidebar" class="sidebar" aria-label="Boards"></aside>
<div id="sidebarScrim" class="sidebar-scrim"></div>
<!--header {"lead":"logo","title":"{{title}}"}-->

<main>
  <section id="setup" class="setup" aria-live="polite" hidden></section>
  <section id="answers" class="answer-banner" hidden></section>
  <section id="waiting" class="waiting" hidden></section>

  <div id="waves" class="waves"></div>
  <div id="lanes"></div>
</main>
<button id="compose" class="fab" type="button" aria-label="New task" title="New task (press n twice)" aria-haspopup="dialog" aria-expanded="false"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
<dialog id="sheet" class="sheet" aria-labelledby="sheetTitle">
  <form id="askForm" data-composer="ask">
    <div class="sheet-head"><h2 id="sheetTitle">New task</h2><button type="button" class="ghost" id="sheetClose" aria-label="Close">✕</button></div>
    <textarea id="askText" rows="4" placeholder="Ask a question or give me a task…" autofocus></textarea>
    <div class="pending-files" data-files></div>
    <div class="row">
      <span class="muted small" id="askStatus"></span>
      <button type="submit" class="primary">Send</button>
    </div>
  </form>
</dialog>
<dialog id="linksSheet" class="sheet" aria-labelledby="linksTitle">
  <div class="sheet-body">
    <div class="sheet-head"><h2 id="linksTitle">Hub links</h2><button type="button" class="ghost" id="linksClose" aria-label="Close">✕</button></div>
    <div id="linksList"></div>
  </div>
</dialog>
<div id="toast" class="toast" role="status" hidden></div>

<script src="claude.js"></script>
<script src="ui-sidebar.js"></script>
<script src="sidebar.js"></script>
<script>Sidebar.mount({ here: decodeURIComponent(location.pathname.split('/')[1] || ''), remember: true });</script>
<script src="dialogs.js"></script>
<script src="ui.js"></script>
<script src="ui-links.js"></script>
<script src="ui-threads.js"></script>
<script src="ui-cards.js"></script>
<script src="ui-header.js"></script>
<script src="ui-snapshot.js"></script>
<script src="attach.js"></script>
<script src="app-core.js"></script>
<script src="app-threads.js"></script>
<script src="app-cards.js"></script>
<script src="app-lanes.js"></script>
<script src="app-asks.js"></script>
<script src="app-needs.js"></script>
<script src="app-header.js"></script>
<script src="app-banner.js"></script>
<script src="app-snapshot.js"></script>
<script src="app.js"></script>
</body>
</html>
