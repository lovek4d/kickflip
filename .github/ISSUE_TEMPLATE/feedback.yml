name: Feedback
description: A bug, an idea or a question about kickflip
title: ""
labels: ["feedback"]
body:
  - type: dropdown
    id: type
    attributes:
      label: Type
      options:
        - bug
        - idea
        - question
      default: 0
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details
      description: What happened, what you wanted, or what you are asking.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: kickflip, node and OS. `kickflip feedback` fills this in.
