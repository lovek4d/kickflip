# Runs the release's test step on every push to main and every pull request, and on demand before a tag is pushed.
name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
      - run: npm ci
      - name: Test
        run: |
          git config --global user.name "kickflip release"
          git config --global user.email "release@users.noreply.github.com"
          node --test
